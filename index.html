<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="一只鹈鹕骑着自行车的纯 SVG 2D 动画页面。">
<meta name="theme-color" content="#f2e5d0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root {
    --paper: #f2e5d0;
    --ink: #214b4b;
    --ink-soft: #52706b;
    --accent: #cf5b41;
    --line: rgba(65, 96, 88, .18);
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    padding: clamp(1.5rem, 4vw, 3.5rem) 1.25rem;
    display: grid;
    place-items: center;
    color: var(--ink);
    background:
      radial-gradient(1100px 600px at 12% -5%, #fff6e4 0%, rgba(255, 246, 228, 0) 62%),
      radial-gradient(900px 520px at 96% 104%, #f4d2ab 0%, rgba(244, 210, 171, 0) 58%),
      linear-gradient(160deg, #f6ead6 0%, #efdfc8 100%);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
      ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: min(1120px, 100%);
    display: grid;
    gap: clamp(1.1rem, 2.4vw, 1.8rem);
  }

  .intro {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
    padding: 0 clamp(.2rem, 1.2vw, 1rem);
  }

  .intro-copy { min-width: 0; }

  .eyebrow {
    margin: 0 0 .7rem;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: "Noto Serif SC", "Songti SC", "STSong", ui-serif, Georgia, serif;
    font-size: clamp(2rem, 4.6vw, 3.6rem);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -.02em;
  }

  h1 .period { color: var(--accent); }

  .lede {
    margin: .7rem 0 0;
    font-size: clamp(.85rem, 1.4vw, 1rem);
    color: var(--ink-soft);
    letter-spacing: .02em;
  }

  .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    margin-bottom: .35rem;
    padding: .55rem .85rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 250, 240, .55);
    color: var(--ink-soft);
    font-size: .72rem;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .badge::before {
    content: "";
    width: .45rem;
    height: .45rem;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(207, 91, 65, .14);
  }

  .scene {
    margin: 0;
    overflow: hidden;
    border: 1px solid rgba(58, 88, 80, .16);
    border-radius: clamp(1.1rem, 2.6vw, 1.9rem);
    background: #bfe5e2;
    box-shadow:
      0 38px 70px -42px rgba(50, 74, 62, .7),
      0 2px 0 rgba(255, 255, 255, .55) inset;
  }

  .illustration {
    display: block;
    width: 100%;
    height: auto;
  }

  .note {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: .35rem 1.5rem;
    margin: 0;
    padding: 0 clamp(.2rem, 1.2vw, 1rem);
    color: var(--ink-soft);
    font-size: .74rem;
    letter-spacing: .04em;
  }

  .note span:last-child { opacity: .8; }

  /* ---------- animation ---------- */

  .wheel-rotor {
    transform-box: view-box;
    transform-origin: 290px 440px;
    animation: wheel-spin 2.6s linear infinite;
  }

  .front-rotor { transform-origin: 620px 440px; }

  .pelican-bob { animation: bob .8s ease-in-out infinite; }

  .neck-head {
    transform-box: view-box;
    transform-origin: 486px 232px;
    animation: head-nod 1.6s ease-in-out infinite;
  }

  .wing {
    transform-box: view-box;
    transform-origin: 486px 226px;
    animation: wing-flap 2.6s ease-in-out infinite;
  }

  .scarf {
    transform-box: view-box;
    transform-origin: 508px 204px;
    animation: scarf-wave 1.35s ease-in-out infinite;
  }

  .tail {
    transform-box: view-box;
    transform-origin: 342px 300px;
    animation: tail-wag 2.2s ease-in-out infinite;
  }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.4s infinite; }

  .sun-glow { animation: sun-breathe 6s ease-in-out infinite; }

  .cloud-track { animation: track-scroll 55s linear infinite; }
  .grass-track { animation: track-scroll 5.5s linear infinite; }
  .road-line { animation: road-dash 1.3s linear infinite; }
  .chain { animation: chain-move 1s linear infinite; }
  .wave-line { animation: wave-dash 4.5s linear infinite; }
  .wave-line.slow { animation-duration: 7.5s; }
  .wave-line.fast { animation-duration: 2.8s; }
  .sailboat-bob { animation: sail-bob 4.5s ease-in-out infinite; }
  .bird-flap {
    transform-box: fill-box;
    transform-origin: center;
    animation: bird-flap 1.25s ease-in-out infinite alternate;
  }
  .shadow {
    transform-box: fill-box;
    transform-origin: center;
    animation: shadow-pulse 1.3s ease-in-out infinite;
  }

  @keyframes wheel-spin { to { transform: rotate(360deg); } }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(2.6px); }
  }

  @keyframes head-nod {
    0%, 100% { transform: rotate(-.8deg); }
    50% { transform: rotate(1.1deg); }
  }

  @keyframes wing-flap {
    0%, 100% { transform: rotate(.7deg); }
    50% { transform: rotate(-3.4deg); }
  }

  @keyframes scarf-wave {
    0%, 100% { transform: rotate(-2.2deg); }
    50% { transform: rotate(2.6deg); }
  }

  @keyframes tail-wag {
    0%, 100% { transform: rotate(0); }
    50% { transform: rotate(2.4deg); }
  }

  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(.12); }
  }

  @keyframes sun-breathe {
    0%, 100% { opacity: .72; }
    50% { opacity: 1; }
  }

  @keyframes track-scroll { to { transform: translateX(-960px); } }

  @keyframes road-dash { to { stroke-dashoffset: 198; } }

  @keyframes chain-move { to { stroke-dashoffset: 14; } }

  @keyframes wave-dash { to { stroke-dashoffset: -120; } }

  @keyframes sail-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.4px); }
  }

  @keyframes bird-flap {
    from { transform: scaleY(1); }
    to { transform: scaleY(.42); }
  }

  @keyframes shadow-pulse {
    0%, 100% { transform: scaleX(1); opacity: .17; }
    50% { transform: scaleX(.985); opacity: .13; }
  }

  @media (max-width: 720px) {
    body { padding: 1.4rem .9rem 2rem; }
    .intro { align-items: flex-start; flex-direction: column; gap: .9rem; }
    .badge { margin: 0; }
    .note { font-size: .68rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene * { animation: none !important; }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  const svg = document.querySelector(".illustration");
  if (!svg) return;

  const byId = (id) => svg.querySelector("#" + id);
  const DOTS = {
    near: { thigh: "thigh-near", shin: "shin-near", knee: "knee-near", foot: "foot-near", pedal: "pedal-near", crank: "crank-near" },
    far: { thigh: "thigh-far", shin: "shin-far", knee: "knee-far", foot: "foot-far", pedal: "pedal-far", crank: "crank-far" }
  };

  const BB = { x: 460, y: 468 };
  const CRANK = 26;
  const HIPS = { near: { x: 402, y: 324 }, far: { x: 392, y: 318 } };
  const THIGH = 96;
  const SHIN = 86;

  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  const state = { angle: 0.55, running: !motionQuery.matches, last: 0 };
  let rafId = 0;

  function line(id, a, b) {
    const el = byId(id);
    if (!el) return;
    el.setAttribute("x1", a.x);
    el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x);
    el.setAttribute("y2", b.y);
  }

  function solveKnee(hip, target) {
    const dx = target.x - hip.x;
    const dy = target.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(THIGH - SHIN) + 0.01), THIGH + SHIN - 0.01);
    const base = Math.atan2(dy, dx);
    const cos = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const offset = Math.acos(Math.max(-1, Math.min(1, cos)));
    const a = { x: hip.x + THIGH * Math.cos(base - offset), y: hip.y + THIGH * Math.sin(base - offset) };
    const b = { x: hip.x + THIGH * Math.cos(base + offset), y: hip.y + THIGH * Math.sin(base + offset) };
    return a.x >= b.x ? a : b;
  }

  function poseLeg(side, hip, pedal) {
    const ids = DOTS[side];
    const knee = solveKnee(hip, pedal);
    line(ids.thigh, hip, knee);
    line(ids.shin, knee, { x: pedal.x, y: pedal.y });
    line(ids.crank, BB, pedal);

    const kneeEl = byId(ids.knee);
    if (kneeEl) {
      kneeEl.setAttribute("cx", knee.x);
      kneeEl.setAttribute("cy", knee.y);
    }

    const pedalEl = byId(ids.pedal);
    if (pedalEl) pedalEl.setAttribute("transform", `translate(${pedal.x} ${pedal.y})`);

    const footEl = byId(ids.foot);
    if (footEl) footEl.setAttribute("transform", `translate(${pedal.x} ${pedal.y - 2})`);
  }

  function render() {
    const near = {
      x: BB.x + Math.cos(state.angle) * CRANK,
      y: BB.y + Math.sin(state.angle) * CRANK
    };
    const far = {
      x: BB.x + Math.cos(state.angle + Math.PI) * CRANK,
      y: BB.y + Math.sin(state.angle + Math.PI) * CRANK
    };

    poseLeg("near", HIPS.near, near);
    poseLeg("far", HIPS.far, far);

    const teeth = byId("chainring-teeth");
    if (teeth) {
      teeth.setAttribute("transform", `rotate(${(state.angle * 180) / Math.PI} 460 468)`);
    }
  }

  function tick(now) {
    if (state.running) {
      if (!state.last) state.last = now;
      const dt = Math.min(now - state.last, 64);
      state.last = now;
      state.angle = (state.angle + (dt / 1600) * Math.PI * 2) % (Math.PI * 2);
      render();
      rafId = requestAnimationFrame(tick);
    }
  }

  function setRunning(running) {
    if (running === state.running && rafId) return;
    state.running = running;
    state.last = 0;
    cancelAnimationFrame(rafId);
    rafId = 0;
    if (running) rafId = requestAnimationFrame(tick);
  }

  if (typeof motionQuery.addEventListener === "function") {
    motionQuery.addEventListener("change", (event) => {
      setRunning(!event.matches);
      if (!event.matches) render();
    });
  }

  // A tiny hook that makes the scene easy to inspect at a fixed pedal angle.
  window.pelicanBike = {
    setFrame(fraction) {
      state.angle = ((Number(fraction) || 0) % 1) * Math.PI * 2;
      render();
    },
    pause() { setRunning(false); },
    play() { setRunning(true); }
  };

  render();
  if (state.running) rafId = requestAnimationFrame(tick);
})();
</script>
