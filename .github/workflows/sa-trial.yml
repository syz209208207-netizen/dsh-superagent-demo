name: Super-Agent Trial
on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post the trial request as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 -R "${{ github.repository }}" --body "@syz209208207-netizen 请把 README.md 里第一段的 \"trial repository\" 改成 \"test repository\"，改完提一个 PR。"
